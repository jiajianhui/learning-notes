<!DOCTYPE html>
<html lang="zh">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>minimal-frontend-demo</title>

        
    </head>

    <body>

        <!-- HTML 提供的元素 -->
        <main>
            <h1>计数器</h1>

            <section>
                <p>当前计数：<span id="span">0</span> </p>

            </section>

            <hr>

            <h1>待办</h1>

            <section>

                <button id="addBtn">添加</button>

                </ul>

            </section>
            
            
        </main>


        <!-- 等 DOM 元素渲染完成，在进行选择 -->
        <script src="./index.js"></script>
    </body>

    

</html>
